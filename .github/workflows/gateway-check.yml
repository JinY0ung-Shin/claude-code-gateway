name: Gateway Check

# 경로 필터를 두지 않는다. 이 저장소의 테스트는 src/ 뿐 아니라 pyproject의 마커·
# addopts, uv.lock, 그리고 tests/fixtures의 mock 바이너리까지 함께 읽는다. 필터를
# 좁히면 "그 PR에서는 안 돌았다"는 조용한 구멍이 생기고, 전체 스위트가 90초라
# 아낄 만한 시간도 아니다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 푸시가 오면 이전 실행은 의미가 없다.
concurrency:
  group: gateway-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # pyproject는 >=3.10만 요구하므로 uv가 실행마다 다른 인터프리터를 고를
          # 수 있다. 로컬 venv와 같은 3.11로 고정해, CI만 초록/빨강이 갈리는
          # 버전 차이를 없앤다.
          python-version: "3.11"

      # --frozen: uv.lock 그대로 설치한다. lock을 갱신해야 하는 PR이라면 여기서
      # 실패하는 것이 맞다 — CI가 조용히 lock을 고쳐 주면 재현성이 사라진다.
      - name: Install
        run: uv sync --frozen

      # `uv run pytest`가 이 저장소의 게이트다. e2e는 pyproject의
      # `addopts = "-m 'not e2e'"`로 빠지고(라이브 서버·크레덴셜 필요),
      # `integration`(mock 바이너리로 실제 subprocess를 띄우는 것)은 기본 실행에
      # 포함되므로 따로 부르지 않는다. stale backend(opencode/codex, 2026-07 동결)
      # 테스트도 conftest가 알아서 deselect한다.
      - name: Tests
        run: uv run pytest -q
